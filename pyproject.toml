[project]
name = "dora-person"
version = "0.1.0"
description = "令和に蘇りし銅鑼パーソン決定戦 - GitHub OAuth 投票アプリ"
readme = "README.md"
authors = [{ name = "notch_man", email = "miyake.kentaro0815@mokkuriko.com" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "hypercorn>=0.17.0",
    "jinja2>=3.1.4",
    "mysql-connector-python>=9.1.0",
    "newrelic>=10.0.0",
    "pydantic-settings>=2.5.0",
    "pyjwt>=2.9.0",
    "python-multipart>=0.0.18",
    "redis>=5.0.0",
]

[dependency-groups]
dev = [
    "fakeredis>=2.26.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.1",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dora_person"]

[tool.ruff]
line-length = 128
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]
# B008 is FastAPI's intended `Depends()` default-argument pattern.
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["dora_person"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
